<div class="w-full px-6 py-4">
  <!-- Header avec recherche et filtres -->
  <div class="flex items-center justify-between mb-6">
    <mat-form-field *ngIf="showFilter" class="search-field" appearance="outline">
      <mat-icon matPrefix class="text-gray-400">search</mat-icon>
      <input
        matInput
        [(ngModel)]="filterValue"
        (keyup)="applyFilter($event)"
        placeholder="Search a User"
        class="text-sm"
      />
    </mat-form-field>

    <button mat-button class="filter-button">
      <mat-icon class="mr-2">filter_list</mat-icon>
      Filters
    </button>
  </div>

  <!-- Table -->
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="custom-table">
      <!-- Colonnes dynamiques -->
      <ng-container *ngFor="let column of _columns" [matColumnDef]="column.key">
        <th
          mat-header-cell
          *matHeaderCellDef
          [mat-sort-header]="column.sortable !== false ? column.key : ''"
          class="table-header"
        >
          {{ column.label }}
        </th>
        <td mat-cell *matCellDef="let element" class="table-cell">
          {{ formatCell(column, element[column.key]) }}
        </td>
      </ng-container>

      <!-- Colonne Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="table-header actions-header"></th>
        <td mat-cell *matCellDef="let element" class="table-cell actions-cell">
          <button mat-icon-button [matMenuTriggerFor]="menu" class="action-menu-button">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" class="action-dropdown">
            <button
              *ngFor="let action of _actions"
              mat-menu-item
              (click)="executeAction(action, element)"
              [hidden]="!shouldShowAction(action, element)"
              class="action-item"
              [ngClass]="'action-' + action.label.toLowerCase()"
            >
              <mat-icon [class]="'icon-' + action.label.toLowerCase()">
                {{ getActionIcon(action.label) }}
              </mat-icon>
              <span>{{ action.label }}</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="table-row"></tr>

      <!-- Message si pas de données -->
      <tr class="mat-row" *matNoDataRow>
        <td class="no-data-cell" [attr.colspan]="displayedColumns.length">
          Aucune donnée disponible
        </td>
      </tr>
    </table>
  </div>

  <!-- Pagination -->
  <mat-paginator
    *ngIf="showPagination"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    showFirstLastButtons
    class="mt-4 bg-white rounded-lg"
  >
  </mat-paginator>
</div>
